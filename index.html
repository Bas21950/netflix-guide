<!DOCTYPE html>
<html lang="th" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>คู่มือการใช้งาน Netflix — ONESTOP AI</title>
  <!-- Google Fonts: Prompt -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Prompt', 'sans-serif'],
          },
          colors: {
            netflix: {
              red: '#E50914',
              card: '#16161B',
              border: '#282830',
            }
          }
        }
      }
    }
  </script>
  <style>
    body {
      background-color: #0A0A0D;
      color: #F3F4F6;
      font-family: 'Prompt', sans-serif;
      -webkit-tap-highlight-color: transparent;
    }
    .active-tab {
      background-color: #E50914 !important;
      color: #FFFFFF !important;
      box-shadow: 0 4px 16px rgba(229, 9, 20, 0.45);
    }
    .active-pill {
      background-color: #E50914 !important;
      color: #FFFFFF !important;
      border-color: #E50914 !important;
    }
    .img-box {
      border: 1px solid #282830;
      border-radius: 1rem;
      overflow: hidden;
      background-color: #121216;
      box-shadow: 0 10px 30px -10px rgba(0, 0, 0, 0.7);
      transition: border-color 0.2s ease, transform 0.2s ease;
    }
    .img-box:hover {
      border-color: #E50914;
    }
    .img-box img {
      cursor: zoom-in;
      display: block;
      width: 100%;
      height: auto;
    }
  </style>
</head>
<body class="min-h-screen flex flex-col pb-16">

  <!-- TOP BAR & MENU TABS -->
  <header class="sticky top-0 z-40 bg-[#0F0F14]/95 backdrop-blur-md border-b border-[#22222A]">
    <div class="max-w-4xl mx-auto px-3 sm:px-4 py-2.5 flex items-center justify-between">
      <div class="flex items-center gap-2">
        <span class="bg-netflix-red text-white font-extrabold text-xs px-2.5 py-1 rounded tracking-wider flex items-center gap-1">
          <i data-lucide="tv" class="w-3.5 h-3.5"></i> ONESTOP AI
        </span>
        <span class="text-xs sm:text-sm font-semibold text-gray-300">คู่มือใช้งาน Netflix</span>
      </div>

      <a href="https://areslanestore.shop" target="_blank" rel="noopener noreferrer" 
         class="inline-flex items-center gap-1.5 bg-[#1F1F28] hover:bg-[#2A2A38] border border-[#333342] text-amber-400 text-xs font-bold px-3 py-1.5 rounded-lg transition">
        <i data-lucide="external-link" class="w-3.5 h-3.5"></i>
        <span>เปิดเว็บรับรหัส</span>
      </a>
    </div>

    <!-- MAIN TABS (แยกเมนูกันชัดเจน) -->
    <div class="bg-[#14141B] border-t border-[#1F1F28]">
      <div class="max-w-4xl mx-auto px-3 sm:px-4 flex gap-2 py-2">
        <button onclick="switchTab('tab-login')" id="btn-tab-login" 
                class="tab-btn active-tab flex-1 flex items-center justify-center gap-1.5 px-3 py-2 rounded-xl text-xs sm:text-sm font-bold transition duration-150 bg-[#1A1A22] text-gray-400 hover:text-white">
          <i data-lucide="key-round" class="w-4 h-4"></i>
          1. คู่มือเข้าสู่ระบบครั้งแรก
        </button>

        <button onclick="switchTab('tab-areslane')" id="btn-tab-areslane" 
                class="tab-btn flex-1 flex items-center justify-center gap-1.5 px-3 py-2 rounded-xl text-xs sm:text-sm font-bold transition duration-150 bg-[#1A1A22] text-gray-400 hover:text-white">
          <i data-lucide="shield-check" class="w-4 h-4"></i>
          2. คู่มือเว็บรับรหัส (areslanestore.shop)
        </button>
      </div>
    </div>
  </header>

  <!-- CONTENT CONTAINER -->
  <main class="max-w-4xl mx-auto px-3 sm:px-4 mt-4 sm:mt-6 flex-1 w-full">

    <!-- ========================================================================= -->
    <!-- MENU 1: คู่มือเข้าสู่ระบบครั้งแรก (มีเฉพาะรูปภาพ 5 ขั้นตอน) -->
    <!-- ========================================================================= -->
    <section id="tab-login" class="space-y-4 sm:space-y-6">
      <div class="img-box">
        <img src="./images/step-01-email.png" alt="ขั้นตอนที่ 1" onclick="openLightbox(this.src)">
      </div>
      <div class="img-box">
        <img src="./images/step-02-help.png" alt="ขั้นตอนที่ 2" onclick="openLightbox(this.src)">
      </div>
      <div class="img-box">
        <img src="./images/step-03-password.png" alt="ขั้นตอนที่ 3" onclick="openLightbox(this.src)">
      </div>
      <div class="img-box">
        <img src="./images/step-04-enter-pwd.png" alt="ขั้นตอนที่ 4" onclick="openLightbox(this.src)">
      </div>
      <div class="img-box">
        <img src="./images/step-05-profile.png" alt="ขั้นตอนที่ 5" onclick="openLightbox(this.src)">
      </div>
    </section>

    <!-- ========================================================================= -->
    <!-- MENU 2: คู่มือเว็บปลดล็อก & รับรหัส (areslanestore.shop) (มีเฉพาะรูปภาพ) -->
    <!-- ========================================================================= -->
    <section id="tab-areslane" class="hidden space-y-4 sm:space-y-6">
      
      <!-- SUB-CASE SWITCHER PILLS -->
      <div class="bg-[#14141B] border border-[#22222A] rounded-xl p-1.5 flex gap-1.5">
        <button onclick="switchCase('case-1')" id="btn-case-1" 
                class="case-pill active-pill flex-1 py-2 rounded-lg text-xs sm:text-sm font-bold text-center border border-transparent transition">
          กรณีที่ 1 : ขอรหัส OTP
        </button>
        <button onclick="switchCase('case-2')" id="btn-case-2" 
                class="case-pill flex-1 py-2 rounded-lg text-xs sm:text-sm font-bold text-center border border-transparent text-gray-400 hover:text-white transition">
          กรณีที่ 2 : มือถือ / PC ติดครัวเรือน
        </button>
        <button onclick="switchCase('case-3')" id="btn-case-3" 
                class="case-pill flex-1 py-2 rounded-lg text-xs sm:text-sm font-bold text-center border border-transparent text-gray-400 hover:text-white transition">
          กรณีที่ 3 : Smart TV ติดครัวเรือน
        </button>
      </div>

      <!-- CASE 1: ขอรหัส OTP (2 รูป) -->
      <div id="case-1" class="case-section space-y-4 sm:space-y-6">
        <div class="img-box">
          <img src="./images/guide-device-01-netflix.png" alt="กรณี 1 หน้าจอ Netflix" onclick="openLightbox(this.src)">
        </div>
        <div class="img-box">
          <img src="./images/guide-web-01-otp.png" alt="กรณี 1 หน้าเว็บ" onclick="openLightbox(this.src)">
        </div>
      </div>

      <!-- CASE 2: มือถือ / แท็บเล็ต / คอมพิวเตอร์ (3 รูป) -->
      <div id="case-2" class="case-section hidden space-y-4 sm:space-y-6">
        <div class="img-box">
          <img src="./images/guide-device-02-mobile.png" alt="กรณี 2 หน้าจอมือถือ" onclick="openLightbox(this.src)">
        </div>
        <div class="img-box">
          <img src="./images/guide-device-02-pc.png" alt="กรณี 2 หน้าจอคอมพิวเตอร์" onclick="openLightbox(this.src)">
        </div>
        <div class="img-box">
          <img src="./images/guide-web-02-household.png" alt="กรณี 2 หน้าเว็บ" onclick="openLightbox(this.src)">
        </div>
      </div>

      <!-- CASE 3: Smart TV (3 รูป) -->
      <div id="case-3" class="case-section hidden space-y-4 sm:space-y-6">
        <div class="img-box">
          <img src="./images/guide-device-03-tv.png" alt="กรณี 3 หน้าจอทีวี" onclick="openLightbox(this.src)">
        </div>
        <div class="img-box">
          <img src="./images/guide-web-03a-travel.png" alt="กรณี 3 แบบ A" onclick="openLightbox(this.src)">
        </div>
        <div class="img-box">
          <img src="./images/guide-web-03b-update.png" alt="กรณี 3 แบบ B" onclick="openLightbox(this.src)">
        </div>
      </div>

    </section>

  </main>

  <!-- LIGHTBOX (ZOOM MODAL) -->
  <div id="lightbox" class="fixed inset-0 z-50 bg-black/95 backdrop-blur-sm hidden items-center justify-center p-2 sm:p-4" onclick="closeLightbox()">
    <div class="relative max-w-5xl w-full max-h-[95vh] flex flex-col items-center" onclick="event.stopPropagation()">
      <button onclick="closeLightbox()" class="absolute -top-11 right-0 text-gray-300 hover:text-white bg-white/10 hover:bg-white/20 p-2 rounded-full transition">
        <i data-lucide="x" class="w-6 h-6"></i>
      </button>
      <img id="lightbox-img" src="" alt="ภาพขยาย" class="max-w-full max-h-[88vh] rounded-lg object-contain shadow-2xl">
    </div>
  </div>

  <!-- SCRIPT -->
  <script>
    // Tab Switching
    function switchTab(tabId) {
      document.getElementById('tab-login').classList.add('hidden');
      document.getElementById('tab-areslane').classList.add('hidden');

      document.getElementById('btn-tab-login').classList.remove('active-tab');
      document.getElementById('btn-tab-areslane').classList.remove('active-tab');

      document.getElementById(tabId).classList.remove('hidden');
      document.getElementById('btn-' + tabId).classList.add('active-tab');
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    // Case Switching for Areslane Tab
    function switchCase(caseId) {
      document.querySelectorAll('.case-section').forEach(el => el.classList.add('hidden'));
      document.querySelectorAll('.case-pill').forEach(el => {
        el.classList.remove('active-pill');
        el.classList.add('text-gray-400');
      });

      document.getElementById(caseId).classList.remove('hidden');
      const btn = document.getElementById('btn-' + caseId);
      btn.classList.add('active-pill');
      btn.classList.remove('text-gray-400');
    }

    // Lightbox
    function openLightbox(src) {
      const modal = document.getElementById('lightbox');
      const img = document.getElementById('lightbox-img');
      img.src = src;
      modal.classList.remove('hidden');
      modal.classList.add('flex');
      document.body.style.overflow = 'hidden';
      lucide.createIcons();
    }

    function closeLightbox() {
      const modal = document.getElementById('lightbox');
      modal.classList.add('hidden');
      modal.classList.remove('flex');
      document.body.style.overflow = '';
    }

    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') closeLightbox();
    });

    lucide.createIcons();
  </script>
</body>
</html>
